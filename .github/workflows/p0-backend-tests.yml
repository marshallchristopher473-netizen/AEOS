name: P0 Security Candidate

on:
  push:
    branches:
      - fix/p0-0-stabilization-reconstruction
      - 'p0/security-*'
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Static compilation check
        run: python -m compileall -q backend/app backend/tests

      - name: Verify backend import
        working-directory: backend
        run: python -c "from app.main import app; print('backend OK')"

      - name: Verify schemas import
        working-directory: backend
        run: python -c "from app.models.schemas import AssessmentCreateRequest, AssessmentResponse; print('schemas OK')"

      - name: Verify dependencies import
        working-directory: backend
        run: python -c "from app.core.dependencies import get_db_user; print('dependencies OK')"

      - name: Run complete backend test suite
        working-directory: backend
        run: python -m pytest tests/ -v

      - name: Run assessment tests separately
        working-directory: backend
        run: python -m pytest tests/test_assessments.py -v

  frontend-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependency vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=low

      - name: Verify frontend dependency tree
        working-directory: frontend
        run: npm ls --all

      - name: Lint frontend
        working-directory: frontend
        env:
          CI: '1'
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build
