name: P0 Security Candidate

on:
  push:
    branches:
      - fix/p0-0-stabilization-reconstruction
      - 'p0/security-*'
      - 'claude/aeos-p0-**'
  pull_request:
    branches:
      - main

jobs:
  # Executes the Supabase migrations against a real PostgreSQL server and proves
  # cross-tenant denial through the database. Every other RLS test in this repo
  # asserts against migration *text* and cannot detect a policy that fails to
  # apply or fails to deny.
  rls-enforcement:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Prove tenant isolation is enforced by the database
        working-directory: backend
        env:
          AEOS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          # Turns a missing database into a hard failure rather than a silent skip.
          AEOS_REQUIRE_RLS_TESTS: '1'
        run: python -m pytest tests/test_rls_enforcement.py -v -rs

      # The complete, unfiltered tests/ directory against the same database.
      # The backend-tests job below has no database, so the RLS module skips
      # there; this is the only run of every test together with live RLS.
      - name: Run the complete backend suite against PostgreSQL 16
        working-directory: backend
        env:
          AEOS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          AEOS_REQUIRE_RLS_TESTS: '1'
        run: python -m pytest tests/ -v -rs --junitxml="$GITHUB_WORKSPACE/backend-junit.xml"

      # pytest exits 0 when tests skip. A skipped security test proves nothing,
      # so any skip, failure or error in the complete run fails the job.
      - name: Require zero failed, errored or skipped tests
        run: |
          python - "$GITHUB_WORKSPACE/backend-junit.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          totals = {
              key: sum(int(suite.get(key, 0)) for suite in suites)
              for key in ("tests", "failures", "errors", "skipped")
          }
          print(totals)
          if totals["tests"] == 0 or any(totals[k] for k in ("failures", "errors", "skipped")):
              sys.exit("complete backend suite did not pass with zero skips")
          EOF

      - name: Publish the complete-suite results for this exact SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-${{ github.sha }}
          path: backend-junit.xml
          if-no-files-found: warn

      # Breaks each tenant control in a throwaway copy and asserts the suite
      # notices. Guards specifically against regressions that leave a policy's
      # NAME intact while removing its effect — e.g. students_select becoming
      # USING (true) — which every string- and regex-based test would accept.
      #
      # Covers the full M01-M20 contract: authentication, JWT validation
      # (including key-type pinning, expiry presence and key-set freshness),
      # actor and organization authority, RLS tenant isolation, lifecycle,
      # write authority, service-role exposure and RLS-blind table privileges.
      # Each mutant is byte-compiled (or its migrations applied) before any test
      # runs, so a mutant that does not build is reported INVALID rather than
      # counted as killed.
      - name: Prove the security suite can actually fail
        working-directory: backend
        env:
          AEOS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m tests.security_mutations --json "$GITHUB_WORKSPACE/mutation-matrix.json"

      # No mutant is excluded from the score any more. The one former
      # EQUIVALENT exclusion (aeos_can_write_org) was refuted by independent
      # verification and is now scored and killed behaviourally, so there is no
      # equivalence claim left to re-prove.

      - name: Publish the mutation matrix for this exact SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-matrix-${{ github.sha }}
          path: mutation-matrix.json
          if-no-files-found: warn

  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Static compilation check
        run: python -m compileall -q backend/app backend/tests

      - name: Verify backend import
        working-directory: backend
        run: python -c "from app.main import app; print('backend OK')"

      - name: Verify schemas import
        working-directory: backend
        run: python -c "from app.models.schemas import AssessmentCreateRequest, AssessmentResponse; print('schemas OK')"

      - name: Verify dependencies import
        working-directory: backend
        run: python -c "from app.core.dependencies import get_db_user; print('dependencies OK')"

      - name: Run complete backend test suite
        working-directory: backend
        run: python -m pytest tests/ -v

      - name: Run assessment tests separately
        working-directory: backend
        run: python -m pytest tests/test_assessments.py -v

  frontend-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned frontend dependencies
        id: frontend-install
        working-directory: frontend
        run: npm ci

      # Full threshold, every dependency, no exceptions file. tee keeps a
      # machine-readable inventory; bash pipefail keeps any finding at or above
      # low severity a failing gate.
      - name: Audit all frontend dependencies
        shell: bash
        working-directory: frontend
        run: npm audit --audit-level=low --json | tee npm-audit.json

      - name: Audit production frontend dependencies
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=low

      - name: Publish dependency audit for the checked-out tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dependency-audit-${{ github.sha }}
          path: frontend/npm-audit.json
          if-no-files-found: warn

      # The remaining gates still run when an audit fails, so a new advisory
      # does not hide a lint, type or build regression.
      - name: Verify frontend dependency tree
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        working-directory: frontend
        run: npm ls --all

      # package.json replaces the Next.js lint plugin's fast-glob with
      # tinyglobby. These guards pin the conditions that make that safe.
      - name: Verify Next.js lint glob override
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        working-directory: frontend
        run: node tests/lint-glob-override.test.mjs

      - name: Lint frontend
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        working-directory: frontend
        env:
          CI: '1'
        run: npm run lint

      - name: Type-check frontend
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        working-directory: frontend
        run: npm run build
